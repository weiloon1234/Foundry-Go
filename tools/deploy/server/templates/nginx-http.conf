# @MARKER@
@UPGRADE_MAP@
@EDGE_GEO@
@UPLOAD_ADMISSION@
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
@EDGE_SERVER@
    client_max_body_size 25m;
@UPLOAD_LOCATIONS@

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
@PROXY@
        proxy_pass http://127.0.0.1:@PORT@;
    }
}
