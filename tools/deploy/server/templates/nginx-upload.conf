    location @UPLOAD_LOCATION@ {
        limit_conn @UPLOAD_ZONE@ @UPLOAD_SLOTS@;
        limit_conn_status 503;
        error_page 503 = @foundry_upload_busy;
        client_max_body_size @UPLOAD_BYTES@;
        client_body_buffer_size 16k;
        client_body_temp_path @UPLOAD_TEMP@;
        client_body_timeout @UPLOAD_CLIENT_BODY@;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_send_timeout @UPLOAD_PROXY_SEND@;
        proxy_connect_timeout @UPLOAD_CONNECT@;
        send_timeout @UPLOAD_SEND@;
@UPLOAD_PROXY@
        proxy_pass http://127.0.0.1:@PORT@;
    }
