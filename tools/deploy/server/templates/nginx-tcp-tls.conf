# Foundry TCP TLS @INSTANCE@ @LISTENER@
server {
@LISTEN@
    ssl_certificate @CERTIFICATE_ROOT@/live/@LINEAGE@/fullchain.pem;
    ssl_certificate_key @CERTIFICATE_ROOT@/live/@LINEAGE@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;
    allow 127.0.0.1/32;
    allow ::1/128;
@SOURCES@
    deny all;
    proxy_connect_timeout 5s;
    proxy_timeout 120s;
    proxy_pass @BACKEND@;
}
