name: Verify and security

'on':
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GOWORK: 'off'
      FOUNDRY_TEST_POSTGRES_REQUIRED: '1'
      FOUNDRY_TEST_REDIS_REQUIRED: '1'
      FOUNDRY_TEST_TYPESCRIPT_REQUIRED: '1'
      FOUNDRY_TEST_REDIS_ADDR: '127.0.0.1:6379'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/typescript/package-lock.json
      - name: Prepare isolated runner services and tools
        shell: bash
        run: |
          set -euo pipefail
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          brew list redis >/dev/null 2>&1 || brew install redis
          brew services start postgresql@16
          brew services start redis
          pg_bin="$(brew --prefix postgresql@16)/bin"
          for attempt in {1..30}; do "$pg_bin/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          "$pg_bin/pg_isready" -h 127.0.0.1
          "$pg_bin/createdb" -h 127.0.0.1 foundry_ci
          redis-cli -h 127.0.0.1 ping
          npm ci --prefix tools/typescript --ignore-scripts
          mkdir -p bin
          GOBIN="$PWD/bin" go install "golang.org/x/tools/gopls@$(cat tools/gopls.version)"
          GOBIN="$PWD/bin" go install "golang.org/x/vuln/cmd/govulncheck@$(cat tools/govulncheck.version)"
          {
            echo "FOUNDRY_TEST_POSTGRES_URL=postgres://$(whoami)@127.0.0.1:5432/foundry_ci?sslmode=disable"
            echo "FOUNDRY_TEST_GOPLS=$PWD/bin/gopls"
            echo "FOUNDRY_TEST_GOVULNCHECK=$PWD/bin/govulncheck"
            echo "FOUNDRY_TEST_NODE=$(command -v node)"
            echo "FOUNDRY_TEST_NPM=$(command -v npm)"
            echo "FOUNDRY_TEST_TYPESCRIPT=$PWD/tools/typescript/node_modules/typescript/lib/tsc.js"
          } >> "$GITHUB_ENV"
      - name: Native framework and independent consumers
        run: make verify
      - name: Persistent backends and races
        run: make test-postgres test-redis
      # Required gopls and TypeScript checks already ran inside make verify.
      - name: Security analysis without cold builds
        if: ${{ !cancelled() }}
        run: make security-check
      - name: Retain security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence
          path: .cache/security-check/report.json
          if-no-files-found: error
          retention-days: 14
