name: Verify and security

'on':
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  FOUNDRY_TEST_POSTGRES_REQUIRED: '1'
  FOUNDRY_TEST_REDIS_REQUIRED: '1'
  FOUNDRY_TEST_TYPESCRIPT_REQUIRED: '1'
  FOUNDRY_TEST_REDIS_ADDR: '127.0.0.1:6379'
  # macOS runners have 7 GB RAM and the largest ORM test compiles peak near
  # 5.3 GB; compile one package at a time rather than swap.
  GOFLAGS: '-p=1'

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
        with:
          profile: verify
      - name: Native framework and independent consumers
        run: make verify

  backends:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
        with:
          profile: backends
      - name: Persistent backends and races
        run: make test-postgres test-redis

  security:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
        with:
          profile: security
      - name: Security analysis without cold builds
        if: ${{ !cancelled() }}
        run: make security-check
      - name: Retain security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence
          path: .cache/security-check/report.json
          if-no-files-found: error
          retention-days: 14
