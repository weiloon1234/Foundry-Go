name: Verify and security

'on':
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOFLAGS: '-trimpath -gcflags=all=-dwarf=false'
  FOUNDRY_TEST_POSTGRES_REQUIRED: '1'
  FOUNDRY_TEST_REDIS_REQUIRED: '1'
  FOUNDRY_TEST_TYPESCRIPT_REQUIRED: '1'
  FOUNDRY_TEST_REDIS_ADDR: '127.0.0.1:6379'

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.paths.outputs.deploy }}
      go: ${{ steps.paths.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select gates from changed paths
        id: paths
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          changed_files() {
            case "$GITHUB_EVENT_NAME" in
              schedule|workflow_dispatch) return 1 ;;
            esac
            case "$GITHUB_REF" in
              refs/tags/*|refs/heads/release/*) return 1 ;;
            esac
            case "${GITHUB_HEAD_REF:-} ${GITHUB_BASE_REF:-}" in
              release/*|*\ release/*) return 1 ;;
            esac
            [ "$(git rev-parse --is-shallow-repository)" = false ] || return 1
            case "$GITHUB_EVENT_NAME" in
              push)
                [ "$CREATED" != true ] && [ "$FORCED" != true ] || return 1
                base=$BEFORE
                head=$AFTER
                git cat-file -e "$base^{commit}" 2>/dev/null || return 1
                git cat-file -e "$head^{commit}" 2>/dev/null || return 1
                git merge-base --is-ancestor "$base" "$head" || return 1
                ;;
              pull_request)
                head=$PR_HEAD
                base=$(git merge-base "$PR_BASE" "$head") || return 1
                ;;
              *) return 1 ;;
            esac
            # Report both paths of a rename, including moves across gate boundaries.
            git diff --no-ext-diff --name-only --no-renames -z "$base" "$head" -- > "$changed"
          }
          deploy=true
          go=true
          if changed_files; then
            deploy=false
            go=false
            while IFS= read -r -d '' path; do
              case "$path" in
                tools/deploy/*|tests/fixtures/deploy-acceptance/*|.github/*) deploy=true ;;
              esac
              case "$path" in
                tools/deploy/*) ;;
                *) go=true ;;
              esac
            done < "$changed"
          else
            echo 'Running all gates: full event or changed-file history unavailable.'
          fi
          printf 'deploy=%s\ngo=%s\n' "$deploy" "$go" >> "$GITHUB_OUTPUT"

  systemd-contract:
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deployment contracts against real systemd
        timeout-minutes: 1
        run: sudo -E env FOUNDRY_REAL_SYSTEMD=1 python3 -B -m unittest discover -s tools/deploy/tests -p test_systemd_contract.py -v

  deploy-acceptance-amd64:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        mode: [fresh, foreign-upgrade]
        include:
          - ubuntu: '24.04'
            mode: feature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Real-systemd container acceptance
        id: acceptance
        env:
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/deploy-acceptance-logs
          DEPLOY_ACCEPTANCE_UBUNTU: ${{ matrix.ubuntu }}
          DEPLOY_ACCEPTANCE_MODE: ${{ matrix.mode }}
        run: |
          echo "logs=$ACCEPTANCE_LOG_DIR" >> "$GITHUB_OUTPUT"
          make deploy-container-acceptance-amd64
      - name: Retain non-private failure logs
        if: ${{ failure() && steps.acceptance.outputs.logs != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-acceptance-amd64-${{ matrix.ubuntu }}-${{ matrix.mode }}
          # Top-level allowlist only; never recurse into private recovery or TLS directories.
          path: |
            ${{ steps.acceptance.outputs.logs }}/*.log
            ${{ steps.acceptance.outputs.logs }}/*.txt
            ${{ steps.acceptance.outputs.logs }}/*.out
            !${{ steps.acceptance.outputs.logs }}/.private-*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14

  deploy-vm-amd64:
    name: deploy-vm-amd64 (${{ matrix.ubuntu }}, ${{ matrix.scenario }}, ${{ matrix.topology }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.scenario == 'recovery' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # Recovery boots two or three VMs per topology; one job per topology keeps
        # each inside the step budget.
        include:
          - {ubuntu: '24.04', scenario: operator, topology: both}
          - {ubuntu: '24.04', scenario: recovery, topology: feature}
          - {ubuntu: '24.04', scenario: recovery, topology: standard}
          - {ubuntu: '26.04', scenario: operator, topology: both}
          - {ubuntu: '26.04', scenario: recovery, topology: feature}
          - {ubuntu: '26.04', scenario: recovery, topology: standard}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Enable KVM and install runner tools
        run: |
          if [ ! -c /dev/kvm ]; then
            echo 'KVM is absent: deploy VM acceptance requires /dev/kvm; no emulation fallback.' >&2
            exit 1
          fi
          # Documented Linux runner rule: ReactiveCircus/android-emulator-runner.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils age rclone
      - name: Real SSH ${{ matrix.scenario }} acceptance on Ubuntu VMs
        id: acceptance
        # Leave time for cleanup/artifact upload before the job deadline.
        timeout-minutes: ${{ matrix.scenario == 'recovery' && 75 || 50 }}
        env:
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/deploy-vm-${{ matrix.scenario }}-${{ matrix.topology }}-logs
        run: |
          echo "logs=$ACCEPTANCE_LOG_DIR" >> "$GITHUB_OUTPUT"
          tools/deploy/tests/run_vm_acceptance.sh --ubuntu '${{ matrix.ubuntu }}' --scenario '${{ matrix.scenario }}' --topology '${{ matrix.topology }}'
      - name: Retain non-private VM failure logs
        if: ${{ failure() && steps.acceptance.outputs.logs != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-vm-amd64-${{ matrix.ubuntu }}-${{ matrix.scenario }}-${{ matrix.topology }}
          # Only explicitly public diagnostics; no guest disks, seed, keys,
          # private CLI/build output, environment or recovery material.
          path: |
            ${{ steps.acceptance.outputs.logs }}/steps.log
            ${{ steps.acceptance.outputs.logs }}/image.txt
            ${{ steps.acceptance.outputs.logs }}/setup-download.log
            ${{ steps.acceptance.outputs.logs }}/*-serial.log
            ${{ steps.acceptance.outputs.logs }}/*-cloud-init.log
            ${{ steps.acceptance.outputs.logs }}/*-stock-packages.log
            ${{ steps.acceptance.outputs.logs }}/*-inspect.log
            ${{ steps.acceptance.outputs.logs }}/*-prepare.log
            ${{ steps.acceptance.outputs.logs }}/*-deploy-*.log
            ${{ steps.acceptance.outputs.logs }}/*-build-*-refusal.log
            ${{ steps.acceptance.outputs.logs }}/*-status-*.log
            ${{ steps.acceptance.outputs.logs }}/*-report-*.log
            ${{ steps.acceptance.outputs.logs }}/*-tools-*.log
            ${{ steps.acceptance.outputs.logs }}/*-role-*.log
            ${{ steps.acceptance.outputs.logs }}/*-units.log
            ${{ steps.acceptance.outputs.logs }}/*-apt-activity.log
            ${{ steps.acceptance.outputs.logs }}/*-host-failure.log
            ${{ steps.acceptance.outputs.logs }}/*-backup-repository.log
            ${{ steps.acceptance.outputs.logs }}/*-host-upgrade.log
            ${{ steps.acceptance.outputs.logs }}/*-reboot-required.log
            ${{ steps.acceptance.outputs.logs }}/*-settle.log
            ${{ steps.acceptance.outputs.logs }}/*-recover-rehearsal.log
            ${{ steps.acceptance.outputs.logs }}/*-recover-takeover.log
            ${{ steps.acceptance.outputs.logs }}/*-backup-run.log
            ${{ steps.acceptance.outputs.logs }}/*-timer-*.log
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.deploy == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
        with:
          profile: ${{ needs.changes.outputs.go == 'true' && 'verify' || 'deploy' }}
      - name: Full verification
        if: ${{ needs.changes.outputs.go == 'true' && needs.changes.outputs.deploy == 'true' }}
        run: make verify
      - name: Native framework and independent consumers
        if: ${{ needs.changes.outputs.go == 'true' && needs.changes.outputs.deploy != 'true' }}
        run: make verify-go
      - name: Deployment and release tools
        if: ${{ needs.changes.outputs.go != 'true' && needs.changes.outputs.deploy == 'true' }}
        run: make deploy-tools-check release-tools-check fmt-check docs-check
      - uses: ./.github/actions/save-go-cache

  backends:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
        with:
          profile: backends
          cache-shard: ${{ matrix.shard }}-of-${{ strategy.job-total }}
      - name: PostgreSQL and races
        env:
          TEST_POSTGRES_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make test-postgres
      - name: Redis acceptance
        if: ${{ matrix.shard == 1 }}
        run: make test-redis
      - uses: ./.github/actions/save-go-cache

  security:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-foundry
        with:
          profile: security
      - name: Security analysis without cold builds
        if: ${{ !cancelled() }}
        run: make security-check
      - name: Retain security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence
          path: .cache/security-check/report.json
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/save-go-cache
